# Metric collections are synced with the metrics they group. This example uses
# its own sync tag: collections are the complete desired set per tag, so syncing
# a file without them deletes every collection managed by that tag.
schema_version: 1
sync_tag: checkout
reference_url: https://github.com/DataDog/experiments-metric-sync-cli
warehouse_metric_sources:
  - sync_id: checkout_events
    name: Checkout events
    sql: |
      SELECT user_id, event_timestamp, revenue
      FROM analytics.checkout_events
    timestamp_column: event_timestamp
    subject_types:
      - name: User
        column_name: user_id
    measures:
      - sync_id: revenue
        name: revenue
        column_name: revenue
        column_type: FLOAT
metrics:
  - sync_id: checkout_revenue
    name: Checkout revenue
    metric_type: simple
    desired_change: METRIC_INCREASES
    simple_metric_aggregation:
      operation: sum
      measure:
        warehouse_metric_source_sync_id: checkout_events
        measure_sync_id: revenue
      timeframe_start_value: 0
  - sync_id: checkout_count
    name: Checkout count
    metric_type: simple
    simple_metric_aggregation:
      operation: count
      measure:
        warehouse_metric_source_sync_id: checkout_events
        kind: each_record
      timeframe_start_value: 0
metric_collections:
  - sync_id: checkout_core
    name: Checkout core
    description: Core checkout KPIs
    is_guardrail: false
    # Members are ordered. Without metric_sync_tag, a member refers to a metric
    # defined under this file's sync_tag.
    metrics:
      - metric_sync_id: checkout_revenue
      - metric_sync_id: checkout_count
      # A metric synced by another tag. The growth tag must sync it first.
      - metric_sync_tag: growth
        metric_sync_id: signups
