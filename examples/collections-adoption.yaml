# Adopt a collection created in the Datadog UI by matching its name. Adoption is
# shallow: the collection keeps its ID, but its member metrics are not adopted.
# Every member must be a metric synced by Metric Sync, so define (or adopt) the
# member metrics too. To adopt by ID instead, set options.upgrade_mode: by_id
# and existing_id on the collection.
schema_version: 1
sync_tag: checkout-adoption
options:
  upgrade_mode: by_name
warehouse_metric_sources:
  - sync_id: checkout_events
    name: Checkout events
    sql: |
      SELECT user_id, event_timestamp, revenue
      FROM analytics.checkout_events
    timestamp_column: event_timestamp
    subject_types:
      - name: User
        column_name: user_id
    measures:
      - sync_id: revenue
        name: revenue
        column_name: revenue
        column_type: FLOAT
metrics:
  - sync_id: checkout_revenue
    name: Checkout revenue
    metric_type: simple
    simple_metric_aggregation:
      operation: sum
      measure:
        warehouse_metric_source_sync_id: checkout_events
        measure_sync_id: revenue
      timeframe_start_value: 0
metric_collections:
  - sync_id: checkout_guardrails
    upgrade_by_name: true
    name: Checkout guardrails
    is_guardrail: true
    metrics:
      - metric_sync_id: checkout_revenue
