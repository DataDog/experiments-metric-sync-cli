schema_version: 1
sync_tag: example-checkout
reference_url: https://github.com/DataDog/experiments-metric-sync-cli
warehouse_metric_sources:
  - sync_id: checkout_events
    name: Checkout events
    sql: |
      SELECT user_id, event_timestamp, revenue
      FROM analytics.checkout_events
    timestamp_column: event_timestamp
    subject_types:
      - name: User
        column_name: user_id
    measures:
      - sync_id: revenue
        name: revenue
        column_name: revenue
        column_type: FLOAT
metrics:
  - sync_id: checkout_revenue
    name: Checkout revenue
    metric_type: simple
    desired_change: METRIC_INCREASES
    simple_metric_aggregation:
      operation: sum
      measure:
        warehouse_metric_source_sync_id: checkout_events
        measure_sync_id: revenue
      timeframe_start_value: 0
  - sync_id: checkout_count
    name: Checkout count
    metric_type: simple
    simple_metric_aggregation:
      operation: count
      measure:
        warehouse_metric_source_sync_id: checkout_events
        kind: each_record
      timeframe_start_value: 0
  - sync_id: checkout_users
    name: Distinct checkout users
    metric_type: simple
    simple_metric_aggregation:
      operation: countDistinctValue
      measure:
        warehouse_metric_source_sync_id: checkout_events
        subject_type_name: User
      timeframe_start_value: 0
  - sync_id: checkouts_per_user
    name: Checkouts per user
    metric_type: ratio
    ratio_metric_aggregation:
      numerator_aggregation:
        operation: count
        measure:
          warehouse_metric_source_sync_id: checkout_events
          kind: each_record
        timeframe_start_value: 0
      denominator_aggregation:
        operation: countDistinctValue
        measure:
          warehouse_metric_source_sync_id: checkout_events
          subject_type_name: User
        timeframe_start_value: 0
