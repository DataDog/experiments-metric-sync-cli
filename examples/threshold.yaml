schema_version: 1
sync_tag: example-checkout
reference_url: https://github.com/DataDog/experiments-metric-sync-cli
warehouse_metric_sources:
  - sync_id: checkout_events
    name: Checkout events
    sql: |
      SELECT user_id, event_timestamp, revenue
      FROM analytics.checkout_events
    timestamp_column: event_timestamp
    subject_types:
      - name: User
        column_name: user_id
    measures:
      - sync_id: revenue
        name: revenue
        column_name: revenue
        column_type: FLOAT
metrics:
  # Threshold metric: fraction of users whose revenue breached a threshold
  # within the timeframe, aggregated per subject.
  - sync_id: checkout_revenue_threshold
    name: Checkout revenue threshold
    metric_type: simple
    desired_change: METRIC_DECREASES
    simple_metric_aggregation:
      operation: threshold
      threshold_aggregation_type: count
      threshold_comparison_operator: gt
      threshold_breach_value: 100
      threshold_timeframe_value: 7
      threshold_timeframe_dimension: days
      measure:
        warehouse_metric_source_sync_id: checkout_events
        measure_sync_id: revenue
      timeframe_start_value: 0
